server.port=8083

# --- MySQL Database Configuration ---
# NOTE: The default username/password below are for local development convenience ONLY.
# In any deployed or production environment, set the DB_USERNAME and DB_PASSWORD environment variables!
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agrifreeze_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- MongoDB NoSQL Database Configuration ---
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/agrifreeze_nosql}
spring.data.mongodb.auto-index-creation=true

# Execute data seeding via DataInitializer.java (JPA)
spring.sql.init.mode=never

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT settings ---
# NOTE: The default secret below is a fallback for local development ONLY.
# Any deployed or shared environment MUST set the JWT_SECRET environment variable and must never rely on this default value!
app.jwt.secret=${JWT_SECRET:dGFzdGUtY29sZC1jaGFpbi1zZWNyZXQta2V5LWFncmlmcmVlemUtMjAyNg==}
app.jwt.expiration-ms=${JWT_EXPIRATION:3600000}

# --- Spring Mail SMTP Configuration ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.connectiontimeout=10000

# --- Google Gemini AI API Configuration ---
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}